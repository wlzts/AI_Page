<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1e9" />
  <meta name="description" content="每天用 AI 做一个好像有用，又好像没什么用的网页。" />
  <title>好像有用网页实验室</title>
  <style>
    :root {
      --bg: #f4f1e9;
      --paper: #fffdf7;
      --ink: #161711;
      --muted: #77766e;
      --line: #d8d4c8;
      --accent: #155b4a;
      --accent-soft: #dfece6;
      --shadow: 0 18px 55px rgba(39, 42, 35, .10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -8%, rgba(21, 91, 74, .13), transparent 35%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    a { color: inherit; }

    .shell {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 54px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .08em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(21, 91, 74, .2);
    }

    .nav-note {
      color: var(--muted);
      font-size: 11px;
    }

    .hero {
      display: grid;
      gap: 26px;
      padding: 54px 0 36px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .16em;
    }

    h1 {
      max-width: 770px;
      margin: 0;
      font-size: clamp(42px, 9vw, 86px);
      line-height: .98;
      letter-spacing: -.065em;
    }

    .hero-copy {
      max-width: 620px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.8;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.45);
      color: #56574f;
      font-size: 11px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 28px 0 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.03em;
    }

    .count {
      color: var(--muted);
      font-size: 11px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search {
      width: 100%;
      min-height: 46px;
      padding: 0 15px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.65);
      transition: border .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .search:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(21, 91, 74, .09);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .card {
      position: relative;
      grid-column: span 6;
      display: flex;
      min-height: 260px;
      overflow: hidden;
      text-decoration: none;
      border: 1px solid rgba(22, 23, 17, .10);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 8px 24px rgba(39, 42, 35, .055);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(21, 91, 74, .35);
      box-shadow: var(--shadow);
    }

    .card:active { transform: scale(.992); }

    .card-main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 22px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tag {
      display: inline-flex;
      padding: 6px 9px;
      border: 1px solid color-mix(in srgb, var(--card-accent) 30%, transparent);
      border-radius: 999px;
      color: var(--card-accent);
      background: color-mix(in srgb, var(--card-accent) 9%, white);
      font-size: 10px;
      font-weight: 800;
    }

    .date {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
    }

    .card h3 {
      max-width: 420px;
      margin: 32px 0 10px;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.08;
      letter-spacing: -.05em;
    }

    .card p {
      max-width: 430px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 28px;
    }

    .open-text {
      color: var(--card-accent);
      font-size: 12px;
      font-weight: 850;
    }

    .arrow {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #fff;
      background: var(--card-accent);
      transition: transform .2s ease;
    }

    .card:hover .arrow { transform: translate(2px, -2px); }

    .card-decoration {
      position: absolute;
      right: -58px;
      bottom: -68px;
      width: 190px;
      height: 190px;
      border: 32px solid color-mix(in srgb, var(--card-accent) 10%, transparent);
      border-radius: 50%;
      pointer-events: none;
    }

    .empty {
      display: none;
      padding: 42px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 20px;
    }

    footer {
      margin-top: 42px;
      padding-top: 18px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .shell { padding: 12px 12px 36px; }
      .nav-note { display: none; }
      .hero { padding: 44px 4px 28px; }
      .grid { gap: 12px; }
      .card { grid-column: span 12; min-height: 250px; }
      .card-main { padding: 20px; }
      .card h3 { margin-top: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="nav">
      <div class="brand">
        <span class="brand-mark">没</span>
        好像有用网页实验室
      </div>
      <span class="nav-note">不定期解决一些没必要解决的问题</span>
    </nav>

    <header class="hero">
      <div>
        <p class="eyebrow">DAILY AI WEB EXPERIMENT</p>
        <h1>认真制作，<br />谨慎有用。</h1>
        <p class="hero-copy">
          每天用 AI 做一个好像有用，又好像没什么用的网页。
          请选择一个具体而微小的问题，开始一次约 30 秒的正式处理。
        </p>
      </div>

      <div class="hero-meta">
        <span class="pill">纯 HTML / CSS / JavaScript</span>
        <span class="pill">手机优先</span>
        <span class="pill">可在微信内打开</span>
      </div>
    </header>

    <section aria-labelledby="worksTitle">
      <div class="section-head">
        <h2 id="worksTitle">网页档案</h2>
        <span class="count" id="countText">0 个项目</span>
      </div>

      <div class="toolbar">
        <input
          class="search"
          id="searchInput"
          type="search"
          placeholder="搜索网页名称或主题"
          maxlength="30"
          autocomplete="off"
          aria-label="搜索网页项目"
        />
      </div>

      <div class="grid" id="projectGrid"></div>
      <div class="empty" id="emptyState">没有找到相关网页，可能这个问题还不够没必要。</div>
    </section>

    <footer>
      每天用 AI 做一个好像有用，又好像没什么用的网页。<br />
      本站所有作品均为独立静态页面，点击卡片即可打开并分享对应网址。
    </footer>
  </main>

  <script>
    /*
      新增作品时，只需：
      1. 在 projects 下建立文件夹，并把作品保存为该文件夹里的 index.html
      2. 在下面的 projects 数组里增加一项

      href 必须使用相对路径，例如：./projects/wash-hair/
      不要写 /projects/wash-hair/，否则项目型 GitHub Pages 可能出现路径错误。
    */
    const projects = [
      {
        title: "今晚洗头审批局",
        description: "根据明日见人风险、当前头顶状态和剩余体力，审批今晚是否值得正式开工。",
        category: "夜间生活",
        date: "2026.08.04",
        href: "./projects/wash-hair/",
        accent: "#235b4e",
        keywords: "洗头 睡觉 拖延 清洁 审批"
      }

      // 复制下面这段即可新增：
      // ,{
      //   title: "今日摸鱼资格认证中心",
      //   description: "根据劳动贡献与精神状态，认证今日是否具备合理摸鱼资格。",
      //   category: "上班",
      //   date: "2026.08.05",
      //   href: "./projects/slack-off/",
      //   accent: "#9b3f32",
      //   keywords: "上班 摸鱼 工作"
      // }
    ];

    const grid = document.getElementById("projectGrid");
    const countText = document.getElementById("countText");
    const searchInput = document.getElementById("searchInput");
    const emptyState = document.getElementById("emptyState");

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      })[char]);
    }

    function render(list) {
      countText.textContent = `${list.length} 个项目`;
      emptyState.style.display = list.length ? "none" : "block";

      grid.innerHTML = list.map((project) => `
        <a
          class="card"
          href="${escapeHTML(project.href)}"
          style="--card-accent:${escapeHTML(project.accent)}"
          aria-label="打开${escapeHTML(project.title)}"
        >
          <div class="card-main">
            <div class="card-top">
              <span class="tag">${escapeHTML(project.category)}</span>
              <span class="date">${escapeHTML(project.date)}</span>
            </div>

            <h3>${escapeHTML(project.title)}</h3>
            <p>${escapeHTML(project.description)}</p>

            <div class="card-bottom">
              <span class="open-text">进入网页处理问题</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </div>
          </div>
          <span class="card-decoration" aria-hidden="true"></span>
        </a>
      `).join("");
    }

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.trim().toLowerCase();

      if (!query) {
        render(projects);
        return;
      }

      const filtered = projects.filter((project) => {
        const content = [
          project.title,
          project.description,
          project.category,
          project.keywords
        ].join(" ").toLowerCase();

        return content.includes(query);
      });

      render(filtered);
    });

    render(projects);
  </script>
</body>
</html>
